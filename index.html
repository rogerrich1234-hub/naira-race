<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naira Race Online</title>
<style>
body{margin:0;background:#0e1012;color:#f2efe6;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 12px 20px;user-select:none;-webkit-user-select:none}
h1{font-size:1.25rem;margin:0 0 10px}
.wrap{position:relative;width:100%;max-width:420px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#2b2d31}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(14,16,18,.88);border-radius:10px;padding:18px}
.ov.hide{display:none}
.ov h2{margin:0;font-size:1.5rem}
.ov p{margin:0;font-size:.9rem;max-width:32ch;white-space:pre-line}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;background:#f5b800;color:#1b1d20;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;touch-action:manipulation}
button.alt{background:#17a2c8;color:#06222b}
.ctrl{display:flex;gap:10px;width:100%;max-width:420px;margin-top:12px}
.ctrl button{flex:1;padding:20px 0;font-size:1.1rem;background:#3a3f45;color:#f2efe6}
.ctrl button:active{background:#555c63}
.ctrl #sb{flex:1.3;background:#17a2c8;color:#06222b}
.ctrl button:disabled{opacity:.4}
.note{margin-top:10px;font-size:.78rem;color:#9aa0a6;text-align:center}
.ov{overflow-y:auto}
#friend{display:none;flex-direction:column;gap:8px;width:100%;max-width:320px}
#friend input,#friend select{font:inherit;padding:10px;border-radius:8px;border:1px solid #3a3f45;background:#1c2024;color:#f2efe6;width:100%;box-sizing:border-box}
#friend .line{display:flex;gap:8px}
#friend .line button{padding:10px 14px}
#fmsg{font-size:.8rem;color:#9aa0a6;min-height:1em}
#fres{display:flex;flex-direction:column;gap:6px;max-height:110px;overflow:auto;font-size:.85rem}
.ures{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1c2024;border-radius:8px;padding:6px 10px}
.ures button{padding:6px 12px;font-size:.85rem}
.top{display:flex;align-items:center;gap:14px;margin:0 0 10px}
.top h1{margin:0}
#sig{display:flex;align-items:flex-end;gap:2px;font-size:.75rem;color:#9aa0a6}
#sig i{width:5px;background:#3a3f45;border-radius:1px;display:block}
#sig b{margin-left:6px;font-weight:600}
#tm{display:none;flex-direction:column;gap:8px;width:100%;max-width:320px}
#tm select{font:inherit;padding:10px;border-radius:8px;border:1px solid #3a3f45;background:#1c2024;color:#f2efe6;width:100%;box-sizing:border-box}
</style>
</head>
<body>
<div class="top"><h1>Naira Race Online</h1><div id="sig"><svg id="wf" width="26" height="20" viewBox="0 0 26 20" fill="none" stroke-linecap="round" stroke-width="2.4"><path class="w3" d="M2 7.5a15 15 0 0 1 22 0" stroke="#3a3f45"/><path class="w2" d="M6 11.5a9.5 9.5 0 0 1 14 0" stroke="#3a3f45"/><path class="w1" d="M9.8 15.2a4.3 4.3 0 0 1 6.4 0" stroke="#3a3f45"/><circle class="w0" cx="13" cy="18" r="1.6" fill="#3a3f45" stroke="none"/><line id="ns" x1="3" y1="2" x2="23" y2="19" stroke="#e5484d" stroke-width="2.4" style="display:none"/></svg><b id="ms">--</b></div></div>
<div class="wrap">
  <canvas id="c" width="720" height="1040"></canvas>
  <div class="ov" id="ov">
    <h2 id="t">Play tournament</h2>
    <p id="m">1 vs 1 tournament: ₦100, ₦200, ₦500 or ₦1,000. Prize is 1.8x.
5-player tournament: ₦1,000. 1st ₦2,200, 2nd ₦1,300, 3rd ₦1,000.
(Play money only)</p>
    <div class="row" id="menu"><button id="b2">1 vs 1</button><button id="b5" class="alt">5-player race</button><button id="bf">Challenge a friend</button><button id="bt" class="alt">Team game</button></div>
    <div class="row" id="stakes" style="display:none"><button data-s="100">₦100 · Prize ₦180</button><button data-s="200">₦200 · Prize ₦360</button><button data-s="500">₦500 · Prize ₦900</button><button data-s="1000">₦1,000 · Prize ₦1,800</button></div>
    <div id="friend">
      <div class="line"><input id="unm" placeholder="Your username" maxlength="12" autocomplete="off"><button id="setn">Save</button></div>
      <div id="fmsg"></div>
      <div class="line"><input id="fq" placeholder="Search friend's username" maxlength="12" autocomplete="off"><button id="sq">Search</button></div>
      <select id="fs"><option value="100">Tournament ₦100 · Prize ₦180</option><option value="200">Tournament ₦200 · Prize ₦360</option><option value="500">Tournament ₦500 · Prize ₦900</option><option value="1000" selected>Tournament ₦1,000 · Prize ₦1,800</option></select>
      <div id="fres"></div>
    </div>
    <div id="tm">
      <select id="ts"><option value="100">Tournament ₦100 · Prize ₦180</option><option value="200">Tournament ₦200 · Prize ₦360</option><option value="500" selected>Tournament ₦500 · Prize ₦900</option><option value="1000">Tournament ₦1,000 · Prize ₦1,800</option></select>
      <button id="trand">Random teammate</button>
      <button id="tfr" class="alt">Team up with a friend</button>
    </div>
    <div class="row" id="inv" style="display:none"><button id="ia">Accept</button><button id="ib" class="alt">Decline</button></div>
    <button id="cn" style="display:none">Cancel</button>
  </div>
</div>
<div class="ctrl">
  <button id="lb">&#9664; Left</button>
  <button id="sb">Shield</button>
  <button id="rb">Right &#9654;</button>
</div>
<button id="mu" style="margin-top:10px;background:#3a3f45;color:#f2efe6;padding:8px 16px;font-size:.85rem">Sound: on</button>
<button id="vb" style="display:none;margin-top:10px;background:#17a2c8;color:#06222b;padding:10px 18px;font-size:.9rem">Voice chat</button>
<p class="note"><a href="/" style="color:#f5b800">Back to lobby</a></p><p class="note">Play money only. No payments in this version.</p>
<script src="/shared.js"></script>
<script>
const $=id=>document.getElementById(id);
(function(){
  const WS=window.WebSocket;let last=0,cur=null;
  function setSig(ms){
    const bars=ms==null?0:ms<80?4:ms<150?3:ms<300?2:1;
    const colr=bars>=3?'#2ecc71':bars===2?'#f5b800':'#e5484d';
    ['w0','w1','w2','w3'].forEach((c,k)=>{const el=document.querySelector('#wf .'+c);el.setAttribute(c==='w0'?'fill':'stroke',k<bars?colr:'#3a3f45')});$('ns').style.display=ms==null?'':'none';
    $('ms').textContent=ms==null?'No signal':Math.round(ms)+' ms';
  }
  setInterval(()=>{if(last&&Date.now()-last>6000)setSig(null)},2000);
  window.WebSocket=function(u,p){
    const s=p?new WS(u,p):new WS(u);
    let iv=null;cur=s;
    s.addEventListener('open',()=>{last=Date.now();iv=setInterval(()=>{if(s.readyState===1)s.send(JSON.stringify({type:'ping',t:Date.now()}))},2000)});
    s.addEventListener('message',e=>{try{const d=JSON.parse(e.data);if(d.type==='pong'){last=Date.now();setSig(Date.now()-d.t)}}catch(x){}});
    s.addEventListener('close',()=>{clearInterval(iv);if(cur===s){setSig(null);last=0}});
    return s;
  };
  window.WebSocket.prototype=WS.prototype;
})();
const c=$('c'),g=c.getContext('2d');g.scale(2,2);
const {FIN,PW,LW,CY}=Shared.C,W=360,H=520,MILES=2;
const ov=$('ov'),T=$('t'),M=$('m'),menu=$('menu'),cn=$('cn'),lb=$('lb'),rb=$('rb'),sb=$('sb');
const PRIZE={2:[1800,0],5:[2200,1300,1000,0,0]};
const naira=v=>'₦'+v.toLocaleString('en-US');
const ord=k=>['1st','2nd','3rd','4th','5th'][k];
const OC=['#f5b800','#2b7fff','#e5484d','#b45cff','#ff8a3d'];
let ws,obs=null,you=0,n=2,stk=1000,bots=[],mode='menu',cd=3,last=0;
const blank=()=>({d:0,v:0,x:1,tx:1,f:0,sh:0,u:false,b:0});
let st=[blank(),blank()];
let team=false,names=[];
const col=i=>i===you?'#0a9d4e':(team?((i>>1)===(you>>1)?'#5fd38d':(i%2?'#ff8a3d':'#f5b800')):OC[i%5]);
const nm=i=>i===you?'You':(names[i]?names[i]:(team?(((i>>1)===(you>>1)?'Teammate':'Rival '+(i%2+1))+(bots[i]?' (bot)':'')):(bots[i]?'Bot '+(i+1):'Racer '+(i+1))));
const MENUTXT='1 vs 1 tournament: ₦100, ₦200, ₦500 or ₦1,000. Prize is 1.8x.\n5-player tournament: ₦1,000. 1st ₦2,200, 2nd ₦1,300, 3rd ₦1,000.\n(Play money only)';
function show(t,m,showMenu,showCancel){$('tm').style.display='none';$('friend').style.display='none';$('inv').style.display='none';$('stakes').style.display='none';T.textContent=t;M.textContent=m;menu.style.display=showMenu?'flex':'none';cn.style.display=showCancel?'':'none';ov.classList.remove('hide')}
function sget(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}
function sset(k,x){try{sessionStorage.setItem(k,x)}catch(e){}}
let cid=sget('cid');if(!cid){cid=Math.random().toString(36).slice(2)+Date.now().toString(36);sset('cid',cid)}
function friendScreen(msg){
  show('Challenge a friend',msg||'Stay on this screen to receive challenges.',false,true);
  $('friend').style.display='flex';
}
function openFriend(){
  if(ws){const o=ws;ws=null;o.close()}
  obs=null;mode='friend';
  const saved=sget('uname');
  $('unm').value=saved;$('fres').textContent='';$('fmsg').textContent='';
  friendScreen();
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws=w;
  w.onopen=()=>{if(saved)w.send(JSON.stringify({type:'setname',name:saved,cid}))};
  w.onmessage=e=>{if(w!==ws)return;handle(JSON.parse(e.data))};
  w.onclose=()=>{if(w===ws&&mode!=='over'){mode='menu';show('Disconnected','Connection lost. Try again.',true,false)}};
}
function handle(d){if(d.type==='rtc'){rtcIn(d.data);return}
  if(d.type==='end'&&d.team){teamEnd(d);return}
  if(d.type==='lobby')show('Searching...','Players found: '+d.have+' of '+d.need+(d.need>=4?'\nEmpty seats fill with bots after 15 seconds (test mode).':''),false,true);
  if(d.type==='match'){you=d.you;n=d.n;stk=d.stake;bots=d.bots;team=!!d.team;names=d.names||[];rtcStart(d);obs=Shared.track(d.seed);st=Array.from({length:n},blank);mode='count';cd=3;ov.classList.add('hide')}
  if(d.type==='state'){
    mode='run';
    d.p.forEach((q,i)=>{const s=st[i];s.d+=(q.d-s.d)*.5;s.v=q.v;s.tx=q.x;s.f=q.f;s.sh=q.sh;s.u=q.u;s.b=q.b});
  }
  if(d.type==='end'){
    mode='over';
    const k2=d.rank.indexOf(you),prize=n===2?(k2===0?Math.round(stk*1.8):0):(PRIZE[n][k2]||0);
    const list=n>2?'\n\n'+d.rank.map((i,j)=>ord(j)+' '+nm(i)).join('\n'):'';
    beep(k2===0?880:200,.5,'triangle',.14);show(k2===0?'You win!':'You finished '+ord(k2),(prize?'Prize: '+naira(prize)+' (play money)':'No prize this time (play money)')+list+(d.left&&n===2?'\nYour rival left the race.':''),true,false);
  }
  if(d.type==='name'){
    if(d.ok){sset('uname',d.name);$('fmsg').textContent='You are '+d.name+'. Stay here to get challenges.'}
    else $('fmsg').textContent=d.msg;
  }
  if(d.type==='results'){
    const box=$('fres');box.textContent='';
    if(!d.list.length){box.textContent='No players found online.';return}
    d.list.forEach(p=>{
      const row=document.createElement('div');row.className='ures';
      const s=document.createElement('span');s.textContent=p.name+(p.busy?' (busy)':'');
      const bt=document.createElement('button');bt.textContent=teamInv?'Team up':'Challenge';bt.disabled=p.busy;
      bt.onclick=()=>{if(ws)ws.send(JSON.stringify({type:'challenge',team:teamInv,to:p.name,stake:+$('fs').value}))};
      row.append(s,bt);box.append(row);
    });
  }
  if(d.type==='err'){$('fmsg').textContent=d.msg;if(mode==='friend')friendScreen(d.msg)}
  if(d.type==='sent')show('Waiting...','Challenge sent to '+d.to+' at '+naira(+$('fs').value)+'. Waiting for an answer...',false,true);
  if(d.type==='declined')friendScreen(d.msg);
  if(d.type==='invite'){show(d.team?'Team up?':'Challenge!',d.team?d.from+' wants you as a teammate in a 2 vs 2 for '+naira(d.stake)+'. (Play money)':d.from+' challenges you to a 1 vs 1 for '+naira(d.stake)+'. (Play money)',false,false);$('inv').style.display='flex'}
  if(d.type==='invite_gone')friendScreen('The challenge was cancelled.');
}
let teamInv=false;
function teamEnd(d){rtcStop();
  mode='over';
  const won=d.winTeam===(you>>1),prize=won?Math.round(stk*1.8):0;
  const list='\n\n'+d.rank.map((i,j)=>ord(j)+' '+nm(i)).join('\n');
  if(typeof beep==='function')beep(won?880:200,.5,'triangle',.14);
  show(won?'Your team wins!':'Other team wins',(prize?'You get '+naira(prize)+' (play money)':'No prize this time (play money)')+list,true,false);
}
function findTeam(stake){
  if(ws){const old=ws;ws=null;old.close()}
  obs=null;mode='wait';
  show('Searching...','Looking for a teammate and 2 opponents at '+naira(stake)+'. Empty seats fill with bots after 15 seconds (test mode).',false,true);
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws=w;
  w.onopen=()=>w.send(JSON.stringify({type:'findteam',stake}));
  w.onmessage=e=>{if(w!==ws)return;handle(JSON.parse(e.data))};
  w.onclose=()=>{if(w===ws&&mode!=='over'){mode='menu';show('Disconnected','Connection lost. Try again.',true,false)}};
}
let pc=null,rtcTx=null,mic=null,rAud=null,vstate='off',rq=[];
function vbTxt(){$('vb').textContent=vstate==='off'?'Voice chat: tap to join':vstate==='on'?'Mic on (tap to mute)':'Mic muted (tap to unmute)'}
function rtcSend(data){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'rtc',data}))}
function rtcStop(){
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(mic){mic.getTracks().forEach(t=>t.stop());mic=null}
  if(rAud){rAud.srcObject=null;rAud=null}
  rtcTx=null;rq=[];vstate='off';$('vb').style.display='none';
}
function rtcStart(d){
  rtcStop();
  if(!d.team||!window.RTCPeerConnection)return;
  if(d.bots&&d.bots[you^1])return;
  $('vb').style.display='';vbTxt();
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  if(you%2===0)rtcTx=pc.addTransceiver('audio',{direction:'sendrecv'});
  pc.onicecandidate=e=>{if(e.candidate)rtcSend({c:e.candidate})};
  pc.ontrack=e=>{rAud=rAud||new Audio();rAud.srcObject=e.streams[0]||new MediaStream([e.track]);rAud.play().catch(()=>{})};
  if(you%2===0){pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>rtcSend({s:pc.localDescription})).catch(()=>{})}
}
function rtcIn(m){
  if(!pc)return;
  if(m.s){
    pc.setRemoteDescription(m.s).then(()=>{
      rq.forEach(c=>{if(pc)pc.addIceCandidate(c).catch(()=>{})});rq=[];
      if(m.s.type==='offer'){const tx=pc.getTransceivers().find(t=>t.mid!==null);if(tx){tx.direction='sendrecv';rtcTx=tx;if(mic)tx.sender.replaceTrack(mic.getAudioTracks()[0]).catch(()=>{})}}if(m.s.type==='offer')return pc.createAnswer().then(a=>pc.setLocalDescription(a)).then(()=>rtcSend({s:pc.localDescription}));
    }).catch(()=>{});
  }else if(m.c){
    if(pc.remoteDescription)pc.addIceCandidate(m.c).catch(()=>{});else rq.push(m.c);
  }
}
$('vb').onclick=async()=>{
  if(!pc)return;
  if(rAud)rAud.play().catch(()=>{});
  if(!mic){
    try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
    catch(e){$('vb').textContent='Mic blocked: allow it in Chrome settings';return}
    if(!pc){mic.getTracks().forEach(t=>t.stop());mic=null;return}
    if(rtcTx)await rtcTx.sender.replaceTrack(mic.getAudioTracks()[0]);vstate='on';
  }else{
    const t=mic.getAudioTracks()[0];t.enabled=!t.enabled;vstate=t.enabled?'on':'muted';
  }
  vbTxt();
};
function find(k,stake){
  if(ws){const old=ws;ws=null;old.close()}
  obs=null;mode='wait';
  show('Searching...',k===2?'Looking for 1 opponent at '+naira(stake)+'...':'Waiting for 5 players.\nEmpty seats fill with bots after 15 seconds (test mode).',false,true);
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws=w;
  w.onopen=()=>w.send(JSON.stringify({type:'find',mode:k,stake:stake||1000}));
  w.onmessage=e=>{if(w!==ws)return;handle(JSON.parse(e.data))};
  w.onclose=()=>{if(w===ws&&mode!=='over'){mode='menu';show('Disconnected','Connection lost. Try again.',true,false)}};
}
$('b2').onclick=()=>{show('Play tournament','Pick a tournament. You only race players in the same tournament. Prize is 1.8x. (Play money)',false,true);$('stakes').style.display='flex'};
document.querySelectorAll('#stakes button').forEach(bt=>{bt.onclick=()=>find(2,+bt.dataset.s)});
$('b5').onclick=()=>find(5);
$('bf').onclick=()=>{teamInv=false;openFriend()};
$('bt').onclick=()=>{show('Team game 2 vs 2','Two teams of two. The first player across the line wins it for the whole team. Each winner gets a prize of 1.8x. (Play money)',false,true);$('tm').style.display='flex'};
$('trand').onclick=()=>findTeam(+$('ts').value);
$('tfr').onclick=()=>{const sv=$('ts').value;teamInv=true;openFriend();$('fs').value=sv;T.textContent='Pick your teammate'};
$('setn').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'setname',name:$('unm').value.trim(),cid}))};
$('sq').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'search',q:$('fq').value.trim()}))};
$('ia').onclick=()=>{if(ws)ws.send(JSON.stringify({type:'accept'}));show('Starting...','Getting ready...',false,false)};
$('ib').onclick=()=>{if(ws)ws.send(JSON.stringify({type:'decline'}));friendScreen()};
cn.onclick=()=>{if(ws){const o=ws;ws=null;o.close()}mode='menu';obs=null;show('Play tournament',MENUTXT,true,false)};
function lane(dir){if(mode==='run'&&ws)ws.send(JSON.stringify({type:'lane',dir}))}
function shield(){if(mode==='run'&&ws)ws.send(JSON.stringify({type:'shield'}))}
lb.onpointerdown=()=>lane(-1);
rb.onpointerdown=()=>lane(1);
sb.onpointerdown=shield;
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')lane(-1);
  if(e.key==='ArrowRight')lane(1);
  if(e.key===' ')shield();
});
let AC=null,eng=null,eg=null,muted=false,lastCc=0,wasHit=false,wasBlk=false,wasSh=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function beep(f,t,type,vol){
  if(muted)return;const a=audio();if(!a)return;
  const o=a.createOscillator(),gn=a.createGain();
  o.type=type||'square';o.frequency.value=f;
  gn.gain.setValueAtTime(vol||.08,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+t);
  o.connect(gn);gn.connect(a.destination);o.start();o.stop(a.currentTime+t);
}
function engine(on,v){
  const a=audio();if(!a)return;
  if(on&&!muted){
    if(!eng){eng=a.createOscillator();eg=a.createGain();eng.type='sawtooth';eg.gain.value=.02;eng.connect(eg);eg.connect(a.destination);eng.start()}
    eng.frequency.value=60+v*18;
  }else if(eng){try{eng.stop()}catch(e){}eng.disconnect();eg.disconnect();eng=null}
}
$('mu').onclick=()=>{muted=!muted;$('mu').textContent='Sound: '+(muted?'off':'on');const a=audio();if(a&&a.state==='suspended')a.resume()};
addEventListener('pointerdown',()=>{const a=audio();if(a&&a.state==='suspended')a.resume()});
function drawObs(x,y,k){
  g.save();g.translate(x+22,y);
  if(k===0){
    g.fillStyle='#111';g.beginPath();g.ellipse(0,0,20,11,0,0,7);g.fill();
    g.strokeStyle='#5a5448';g.lineWidth=3;g.stroke();
    g.fillStyle='#000';g.beginPath();g.ellipse(2,1,12,6,0,0,7);g.fill();
  }else if(k===1){
    g.fillStyle='#f5b800';g.beginPath();g.roundRect(-14,-20,28,40,4);g.fill();
    g.fillStyle='#111';g.fillRect(-14,-4,28,6);
    g.fillStyle='#1c2a35';g.fillRect(-11,-17,22,7);g.fillRect(-11,11,22,6);
    g.fillStyle='#ff2b2b';g.fillRect(-13,18,6,2);g.fillRect(7,18,6,2);
  }else{
    g.fillStyle='#222';g.fillRect(-2,-18,4,36);
    g.fillStyle='#e5484d';g.beginPath();g.roundRect(-6,-6,12,16,4);g.fill();
    g.fillStyle='#f2c9a0';g.beginPath();g.arc(0,-8,5,0,7);g.fill();
    g.fillStyle='#111';g.fillRect(-9,-2,18,2);
  }
  g.restore();
}
function drawCar(x,y,colr,hit,v){
  g.save();g.translate(x,y);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.roundRect(-17,-27,38,58,10);g.fill();
  g.fillStyle='#0b0b0c';
  [[-17,-18],[11,-18],[-17,10],[11,10]].forEach(p=>{g.beginPath();g.roundRect(p[0],p[1],7,16,2);g.fill()});
  g.fillStyle=hit?'#e5484d':colr;
  g.beginPath();g.moveTo(-12,-28);g.quadraticCurveTo(0,-34,12,-28);g.lineTo(14,-10);g.lineTo(14,14);
  g.quadraticCurveTo(14,28,8,29);g.lineTo(-8,29);g.quadraticCurveTo(-14,28,-14,14);g.lineTo(-14,-10);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(-2,-30,4,58);
  g.fillStyle='#1c2a35';g.beginPath();g.roundRect(-9,-14,18,10,3);g.fill();
  g.beginPath();g.roundRect(-9,8,18,8,3);g.fill();
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-9,-4,18,12);
  g.fillStyle='rgba(255,255,255,.25)';g.beginPath();g.roundRect(-9,-14,8,3,1);g.fill();
  g.fillStyle='#fff6c8';g.fillRect(-11,-28,6,3);g.fillRect(5,-28,6,3);
  g.fillStyle='#ff2b2b';g.fillRect(-12,26,6,3);g.fillRect(6,26,6,3);
  if(v>6){g.fillStyle='rgba(255,150,40,.8)';g.beginPath();g.moveTo(-3,30);g.lineTo(0,38+Math.random()*4);g.lineTo(3,30);g.fill()}
  g.restore();
}
function panel(s,x,colr,name,lead){
  g.save();g.translate(x,0);g.beginPath();g.rect(0,0,PW,H);g.clip();
  g.fillStyle='#2b2d31';g.fillRect(0,0,PW,H);
  g.fillStyle='#d9d4c4';const off=s.d%50;
  for(let y=-50+off;y<H;y+=50){g.fillRect(LW-1,y,2,24);g.fillRect(2*LW-1,y,2,24)}
  g.fillStyle='#0a7d3e';g.fillRect(0,0,3,H);g.fillRect(PW-3,0,3,H);
  const fy=CY-(FIN-s.d);
  if(fy>-20&&fy<H){for(let i=0;i<9;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#fff':'#111';g.fillRect(i*20,fy+j*10-10,20,10)}}
  obs.forEach(b=>{const y=CY-(b.d-s.d);if(y<-30||y>H+30)return;const bx=b.l*LW+8;
    drawObs(bx,y,1+Math.floor(b.d)%2);
    });
  const px=s.x*LW+LW/2;
  drawCar(px,CY,colr,s.f>0,s.v);
  if(s.sh>0||s.b>0){g.lineWidth=3;g.strokeStyle=s.b>0?'#fff':'#2bd4ff';g.beginPath();g.arc(px,CY,36,0,7);g.stroke()}
  const gx=PW/2,gy=H-8,f=Math.min(1,s.v/7);
  g.lineWidth=7;g.strokeStyle='rgba(255,255,255,.2)';g.beginPath();g.arc(gx,gy,38,Math.PI,2*Math.PI);g.stroke();
  g.strokeStyle=colr;g.beginPath();g.arc(gx,gy,38,Math.PI,Math.PI+Math.PI*f);g.stroke();
  g.lineWidth=1;g.fillStyle='#fff';g.textAlign='center';
  g.font='bold 16px Trebuchet MS,sans-serif';g.fillText(Math.round(f*200),gx,gy-8);
  g.font='9px Trebuchet MS,sans-serif';g.fillText('mph',gx,gy+2);g.textAlign='left';
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,PW,36);
  g.fillStyle=colr;g.fillRect(6,26,(PW-12)*Math.min(1,s.d/FIN),6);
  g.fillStyle='#fff';g.font='bold 12px Trebuchet MS,sans-serif';g.textBaseline='middle';
  g.fillText(name+(lead&&s.d>5?' - leading':''),6,11);
  g.textAlign='right';g.fillText((Math.min(1,s.d/FIN)*MILES).toFixed(2)+' mi',PW-6,11);
  g.textAlign='left';g.textBaseline='alphabetic';
  g.restore();
}
function board(x){boardMain(x);if(team){g.save();g.translate(x,0);g.fillStyle='#14171a';g.fillRect(0,H-56,PW,56);g.fillStyle='#9aa0a6';g.font='10px Trebuchet MS,sans-serif';g.fillText('Team game (play money)',10,H-42);g.fillText('First home wins for the team',10,H-28);g.fillText('Each winner gets '+naira(Math.round(stk*1.8)),10,H-14);g.restore()}}
function boardMain(x){
  g.save();g.translate(x,0);
  g.fillStyle='#14171a';g.fillRect(0,0,PW,H);
  g.fillStyle='#fff';g.font='bold 13px Trebuchet MS,sans-serif';g.fillText('Standings',10,22);
  const order=st.map((s,i)=>i).sort((a,b)=>st[b].d-st[a].d);
  order.forEach((i,k)=>{
    const y=34+k*62,s=st[i];
    g.fillStyle=i===you?'#1d3a2a':'#1c2024';g.fillRect(6,y,PW-12,54);
    g.fillStyle=col(i);g.fillRect(6,y,4,54);
    g.fillStyle='#fff';g.font='bold 13px Trebuchet MS,sans-serif';g.fillText((k+1)+'. '+nm(i),16,y+18);
    g.fillStyle='#bbb';g.font='11px Trebuchet MS,sans-serif';
    g.fillText((Math.min(1,s.d/FIN)*MILES).toFixed(2)+' mi  '+Math.round(Math.min(1,s.v/7)*200)+' mph',16,y+34);
    g.fillStyle='#3a3f45';g.fillRect(16,y+42,PW-32,5);
    g.fillStyle=col(i);g.fillRect(16,y+42,(PW-32)*Math.min(1,s.d/FIN),5);
  });
  g.fillStyle='#9aa0a6';g.font='10px Trebuchet MS,sans-serif';
  g.fillText('Prizes (play money)',10,H-48);
  g.fillText('1st '+naira(2200),10,H-34);
  g.fillText('2nd '+naira(1300)+'   3rd '+naira(1000),10,H-20);
  g.restore();
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  const me=st[you]||blank();
  engine(mode==='run',me.v);
  const cc=mode==='count'?Math.ceil(cd):0;
  if(cc!==lastCc){if(cc>0)beep(440,.15,'square',.1);else if(lastCc>0)beep(880,.4,'square',.12);lastCc=cc}
  const hitNow=me.f>0;if(hitNow&&!wasHit)beep(110,.3,'sawtooth',.15);wasHit=hitNow;
  const blkNow=me.b>0;if(blkNow&&!wasBlk)beep(700,.15,'triangle',.12);wasBlk=blkNow;
  const shNow=me.sh>0;if(shNow&&!wasSh)beep(520,.25,'sine',.12);wasSh=shNow;
  lb.disabled=rb.disabled=mode!=='run';
  sb.disabled=mode!=='run'||me.u;
  sb.textContent=me.sh>0?'Shield ON '+me.sh.toFixed(1)+'s':(me.u?'Shield used':'Shield');
  if(obs){
    if(mode==='count')cd-=dt;
    st.forEach(s=>{
      if(mode==='run')s.d+=s.v*dt*60;
      s.x+=(s.tx-s.x)*Math.min(1,dt*20);
      if(s.f>0)s.f-=dt;
      if(s.b>0)s.b-=dt;
    });
    const lead=st.every((s,i)=>i===you||st[you].d>=s.d);
    panel(st[you],0,'#0a9d4e','You',lead);
    if(n===2)panel(st[1-you],PW,'#f5b800','Rival',st[1-you].d>st[you].d);
    else board(PW);
    g.fillStyle='#000';g.fillRect(PW-1,0,2,H);
    if(mode==='count'){g.fillStyle='#fff';g.font='bold 72px Trebuchet MS,sans-serif';g.textAlign='center';g.fillText(cd>0?Math.ceil(cd):'Go!',W/2,H/2);g.textAlign='left'}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
